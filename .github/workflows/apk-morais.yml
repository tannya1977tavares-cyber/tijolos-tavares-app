name: Gerar APK Morais Tavares

on:
  push:
    branches: [main]
    paths:
      - "morais/**"
      - ".github/workflows/apk-morais.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morais
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Copiar bibliotecas pro app
        run: npm run libs

      - name: Criar projeto Android
        run: |
          npx cap add android
          VERSAO=${{ github.run_number }} python3 scripts/preparar-android.py
          npx cap sync android

      - name: Montar APK
        working-directory: morais/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OrcamentoMorais.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrcamentoMorais-apk
          path: morais/OrcamentoMorais.apk

      # make_latest false: não confunde a atualização automática do app da Tijolos Tavares
      - name: Publicar pra baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: morais-1.0.${{ github.run_number }}
          name: Orçamento Morais Tavares 1.0.${{ github.run_number }}
          body: Baixe o arquivo OrcamentoMorais.apk no celular e instale.
          files: morais/OrcamentoMorais.apk
          make_latest: false
