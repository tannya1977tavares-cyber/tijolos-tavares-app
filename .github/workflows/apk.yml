name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Testar o relatório
        run: node testes/relatorio.test.js

      - name: Instalar dependências
        run: npm install

      - name: Copiar bibliotecas pro app
        run: |
          npm run libs
          echo "window.VERSAO_APP = ${{ github.run_number }};" > www/versao.js

      - name: Assinatura fixa (pra atualizar por cima sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp assinatura/tijolos.keystore ~/.android/debug.keystore

      - name: Criar projeto Android
        run: |
          npx cap add android
          VERSAO=${{ github.run_number }} python3 scripts/preparar-android.py
          npx cap sync android

      - name: Montar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TijolosTavares.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TijolosTavares-apk
          path: TijolosTavares.apk

      - name: Publicar pra baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tijolos Tavares 1.0.${{ github.run_number }}
          body: Baixe o arquivo TijolosTavares.apk no celular e instale.
          files: TijolosTavares.apk
          make_latest: true
